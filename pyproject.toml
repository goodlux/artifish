[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artifish"
version = "0.1.0"
description = "A suite of AI agents for Bluesky built with Google ADK"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Rob", email = "rob@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core dependencies
    "python-dotenv>=1.0.0",
    "certifi>=2024.2.2",
    
    # Database
    "supabase>=0.7.1",
    "neo4j>=5.8.1",
    "gqlalchemy>=1.2.0",
    
    # Bluesky API
    "atproto>=0.0.21",
    "aiohttp>=3.8.4",
    
    # NLP and Sentiment Analysis
    "nltk>=3.8.1",
    "vaderSentiment>=3.3.2",
    "scikit-learn>=1.2.2",
    
    # Utilities
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.2",
    "tqdm>=4.65.0",
    
    # Logging
    "structlog>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
artifish = "artifish.agent:main"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=artifish --cov-report=html --cov-report=term-missing"